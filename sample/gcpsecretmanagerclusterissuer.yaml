apiVersion: secret-manager.cert-manager.io/v1alpha1
kind: GCPSecretManagerClusterIssuer
metadata:
  name: gcp-prod
spec:
  project: my-gcp-project
  # secretRef optional — omit to use Workload Identity
  # Keys: credentials-json (full GCP service account key JSON)
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-tls
  namespace: default
  annotations:
    # Full GCP Secret Manager resource name (projects/p/secrets/s/versions/v)
    cert-manager.io/secret-manager-secret-name: projects/my-gcp-project/secrets/my-app-cert/versions/latest
spec:
  secretName: app-tls-secret
  issuerRef:
    name: gcp-prod
    group: secret-manager.cert-manager.io
    kind: GCPSecretManagerClusterIssuer
