apiVersion: secret-manager.cert-manager.io/v1alpha1
kind: TencentSecretManagerClusterIssuer
metadata:
  name: tc-prod
spec:
  region: ap-hongkong
  # secretRef optional — omit to use TKE OIDC / CVM metadata chain
  # Keys: secret-id, secret-key
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-tls
  namespace: default
  annotations:
    cert-manager.io/secret-manager-secret-name: AbCdEf123
spec:
  secretName: app-tls-secret
  issuerRef:
    name: tc-prod
    group: secret-manager.cert-manager.io
    kind: TencentSecretManagerClusterIssuer
