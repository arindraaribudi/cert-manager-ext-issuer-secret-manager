apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-ext-issuer-secret-manager
rules:
- apiGroups: [""]
  resources: ["secrets", "events"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates", "certificates/status"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["secret-manager.cert-manager.io"]
  resources:
    - "awssecretmanagerissuers"
    - "awssecretmanagerissuers/status"
    - "awssecretmanagerclusterissuers"
    - "awssecretmanagerclusterissuers/status"
    - "gcpsecretmanagerissuers"
    - "gcpsecretmanagerissuers/status"
    - "gcpsecretmanagerclusterissuers"
    - "gcpsecretmanagerclusterissuers/status"
    - "tencentsecretmanagerissuers"
    - "tencentsecretmanagerissuers/status"
    - "tencentsecretmanagerclusterissuers"
    - "tencentsecretmanagerclusterissuers/status"
  verbs: ["get", "list", "watch"]