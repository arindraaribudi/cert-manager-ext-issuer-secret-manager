name: ci

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0 or v0.2.0-rc1)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Tag to build"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: build + push multi-arch image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64' }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}', github.repository) }}
    steps:
      - name: resolve tag + sha
        id: resolve
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          echo "tag=${tag}" >>"$GITHUB_OUTPUT"
          echo "sha=${{ github.sha }}" >>"$GITHUB_OUTPUT"

      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: set up qemu
        uses: docker/setup-qemu-action@v4.4.0

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: log in to ghcr
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.resolve.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag, '-') }}
          flavor: latest=auto

      - name: build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: summary
        if: always()
        run: |
          {
            echo "### Docker ${{ steps.resolve.outputs.tag }}"
            echo ""
            echo "- status: \`${{ job.status }}\`"
            echo "- image: \`${{ env.IMAGE_NAME }}\`"
            echo "- tag: \`${{ steps.resolve.outputs.tag }}\`"
            echo "- sha: \`${{ steps.resolve.outputs.sha }}\`"
            echo "- trigger: \`${{ github.event_name }}\`"
          } >>"$GITHUB_STEP_SUMMARY"
